name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # postinstall 里的 prisma generate 失败会被静默吞掉，这里显式执行一次
      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare database
        run: pnpm prisma migrate deploy

      - name: Build for production server
        run: pnpm build

      # 显式起服务并就绪探测：Playwright 以复用模式连接，
      # 规避其清理 webServer 进程树时被残留的 next-server 卡死的问题
      - name: Start production server
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && echo "server ready" && exit 0
            sleep 1
          done
          echo "server failed to start" && exit 1

      - name: Run E2E smoke
        run: pnpm test:e2e
